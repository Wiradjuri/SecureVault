[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sysinfo = "0.37"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
walkdir = "2"
nix = { version = "0.29", features = ["process", "fs"] }
